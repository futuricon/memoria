services:
  postgres:
    image: postgres:16
    container_name: memoria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: memoria
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memoria_local}
    ports:
      - "5432:5432"
    volumes:
      - memoria-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria -d memoria"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    image: memoria:local
    container_name: memoria-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=memoria;Username=memoria;Password=${POSTGRES_PASSWORD:-memoria_local}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-memoria_bot}
      Telegram__SpaUrl: ${SPA_ORIGIN:-http://localhost:4200}
      OAuth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      OAuth__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      OAuth__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Cors__AllowedOrigins__0: ${SPA_ORIGIN:-http://localhost:5173}
      Hangfire__AllowedEmails__0: ${HANGFIRE_ADMIN_EMAIL:-}
      Admin__Emails__0: ${Admin__Emails__0:-}
      Ai__Provider: ${AI_PROVIDER:-Claude}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__GradingModel: ${AI_GRADING_MODEL:-}
      Ai__ValidationModel: ${AI_VALIDATION_MODEL:-}
      Email__ApiKey: ${RESEND_API_KEY:-}
      Email__FromAddress: ${RESEND_FROM_ADDRESS:-Memoria <noreply@memoria.futuricon.net>}
      # Toggle verbose logging temporarily via LOG_LEVEL (see .env.example).
      Serilog__MinimumLevel__Default:                       ${LOG_LEVEL:-Information}
      Serilog__MinimumLevel__Override__Microsoft:           ${LOG_LEVEL_MICROSOFT:-Warning}
      Serilog__MinimumLevel__Override__System:              ${LOG_LEVEL_SYSTEM:-Warning}
      Serilog__MinimumLevel__Override__Microsoft.AspNetCore: ${LOG_LEVEL_ASPNETCORE:-Warning}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  memoria-pg-data:
