<div class="min-h-screen flex flex-col md:flex-row bg-page">
  <!-- Mobile top bar -->
  <header
    class="md:hidden sticky top-0 z-30 h-12 px-3 flex items-center gap-2 bg-page border-b border-default"
  >
    <button
      type="button"
      (click)="openSidebar()"
      class="w-10 h-10 -ml-1 rounded-md text-fg-secondary hover:bg-surface-hover flex items-center justify-center"
      aria-label="Open menu"
    >
      <app-icon name="menu" [size]="20" />
    </button>
    <div class="h-12 px-5 flex items-center gap-2 border-b border-default">
      <app-logo [size]="20" />
      <span class="text-sm font-semibold tracking-tight"> Memoria </span>
    </div>
    <app-theme-toggle />
  </header>

  <!-- Mobile backdrop -->
  <div
    class="sidebar-backdrop fixed inset-0 bg-black/55 z-40 md:hidden"
    [class.is-open]="sidebarOpen()"
    (click)="closeSidebar()"
  ></div>

  <!-- Sidebar — sticky on md+, off-canvas drawer on mobile -->
  <aside
    class="sidebar-mobile md:translate-x-0 md:sticky md:top-0 md:h-screen md:self-start fixed inset-y-0 left-0 z-40 w-64 bg-sidebar border-r border-default flex flex-col pb-safe"
    [class.is-open]="sidebarOpen()"
  >
    <div class="h-12 px-5 flex items-center gap-2 border-b border-default">
      <app-logo [size]="24" />
      <span class="text-sm font-semibold tracking-tight"> Memoria </span>
    </div>

    <nav class="flex-1 px-3 py-4 text-sm flex flex-col gap-0.5">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          routerLinkActive="!bg-brand-soft !text-fg border border-brand-soft"
          class="flex items-center gap-2.5 px-3 py-2 rounded-md text-fg-secondary hover:bg-surface-hover hover:text-fg border border-transparent transition-colors"
          (click)="closeSidebar()"
        >
          <app-icon [name]="item.icon" [size]="16" />
          <span>{{ item.label }}</span>
        </a>
      }
      @if (auth.isAdmin()) {
        <a
          [routerLink]="adminNavItem.path"
          routerLinkActive="!bg-brand-soft !text-fg border border-brand-soft"
          class="flex items-center gap-2.5 px-3 py-2 mt-3 rounded-md text-fg-secondary hover:bg-surface-hover hover:text-fg border border-transparent transition-colors"
          (click)="closeSidebar()"
        >
          <app-icon [name]="adminNavItem.icon" [size]="16" />
          <span>{{ adminNavItem.label }}</span>
        </a>
      }
    </nav>

    <div
      class="px-3 pb-3 hidden md:flex justify-between items-center gap-2 border-t border-default pt-3"
    >
      <app-theme-toggle />
      <button
        type="button"
        (click)="logout()"
        class="h-9 px-2.5 rounded-md text-fg-secondary hover:bg-surface-hover hover:text-fg text-xs flex items-center gap-1.5 transition-colors"
      >
        <app-icon name="log-out" [size]="16" />
        Log out
      </button>
    </div>
    <button
      type="button"
      (click)="logout()"
      class="md:hidden mx-3 mb-3 mt-auto h-10 rounded-md border border-default text-fg-secondary hover:bg-surface-hover text-sm flex items-center justify-center gap-1.5"
    >
      <app-icon name="log-out" [size]="16" />
      Log out
    </button>
  </aside>

  <main class="flex-1 min-w-0">
    <router-outlet />
  </main>
</div>
