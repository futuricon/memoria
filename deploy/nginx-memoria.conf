# Memoria — nginx reverse-proxy template.
#
# Install:
#   sudo cp deploy/nginx-memoria.conf /etc/nginx/sites-available/memoria
#   sudo ln -s /etc/nginx/sites-available/memoria /etc/nginx/sites-enabled/memoria
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d memoria.futuricon.net -m futuricon.net@gmail.com --agree-tos --non-interactive
#
# After certbot runs, this file will be modified to add `listen 443 ssl;` and
# an HTTP → HTTPS redirect block. Leave certbot's edits in place.

server {
    listen 80;
    listen [::]:80;
    server_name memoria.futuricon.net;

    # Telegram WebApp / OAuth callbacks can carry long URLs.
    large_client_header_buffers 4 16k;

    # Real client IP — used by API rate-limit partition keys and Serilog logs.
    # Loopback request from the app itself is the only thing nginx will see
    # internally; trust the X-Forwarded-For from the load balancer if you put
    # one in front (Cloudflare etc.).
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Health probe — bypass logs to keep them clean.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080/healthz;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE (Hangfire dashboard streams stats).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Telegram polling + OAuth round-trips occasionally take a few seconds.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
