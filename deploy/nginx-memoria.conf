# Memoria SPA — nginx static-files template.
#
# Phase 0F splits the public surface:
#   memoria.example.com      → Angular SPA (this vhost, static files)
#   api.memoria.example.com  → ASP.NET Core API + /jobs dashboard
#                              (see deploy/nginx-memoria-api.conf)
#
# Install:
#   sudo cp deploy/nginx-memoria.conf /etc/nginx/sites-available/memoria
#   sudo ln -sf /etc/nginx/sites-available/memoria /etc/nginx/sites-enabled/memoria
#   sudo mkdir -p /var/www/memoria-spa && sudo chown memoria:memoria /var/www/memoria-spa
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d memoria.example.com -m you@example.com --agree-tos --non-interactive
#
# After certbot runs, this file will be modified to add `listen 443 ssl;` and
# an HTTP → HTTPS redirect block. Leave certbot's edits in place.
#
# The SPA bundle is uploaded by GitHub Actions to /var/www/memoria-spa/ as the
# `memoria` user (see .github/workflows/deploy.yml). The Angular application
# builder emits a `browser/` subfolder — that is the root we serve.

server {
    listen 80;
    listen [::]:80;
    server_name memoria.example.com;

    root /var/www/memoria-spa/browser;
    index index.html;

    # Hashed assets are content-addressed → safe to cache for a year.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached — it carries the manifest of hashed assets,
    # and a stale index pinned in a CDN/browser will reference deleted chunks.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: any unknown route gets index.html so the Angular router
    # can pick it up client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
