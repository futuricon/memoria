# Memoria — Dozzle (log viewer) reverse-proxy template.
#
# Dozzle listens on 127.0.0.1:8081 (see docker-compose.prod.yml). This vhost
# puts TLS + HTTP basic-auth in front of it and serves it at logs.<domain>.
#
# One-time install on the VPS:
#   # 1. DNS: add an A record for logs.memoria.example.com → your VPS IP.
#   # 2. basic-auth user (you'll be prompted for a password):
#   sudo apt-get install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-dozzle <your-username>
#   # 3. vhost:
#   sudo cp deploy/nginx-dozzle.conf /etc/nginx/sites-available/memoria-logs
#   sudo ln -s /etc/nginx/sites-available/memoria-logs /etc/nginx/sites-enabled/memoria-logs
#   sudo nginx -t && sudo systemctl reload nginx
#   # 4. TLS (also flips 80 → 443 redirect):
#   sudo certbot --nginx -d logs.memoria.example.com -m you@example.com --agree-tos --redirect --non-interactive

server {
    listen 80;
    listen [::]:80;
    server_name logs.memoria.example.com;

    location / {
        auth_basic           "Memoria logs";
        auth_basic_user_file /etc/nginx/.htpasswd-dozzle;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dozzle streams logs over SSE / WebSocket — keep the connection open and
        # don't buffer, or the live tail stalls.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
