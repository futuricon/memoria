# Production compose: Memoria runs on the host network stack (single container,
# no extra layer of bridge networking), connects to PostgreSQL on 127.0.0.1:5432
# of the host machine, and listens on 127.0.0.1:8080 (nginx reverse-proxies HTTPS
# from memoria.example.com → http://127.0.0.1:8080).
#
# Secrets are read from /opt/memoria/.env on the VPS (NEVER committed to git).
# Image is pulled from ghcr.io/futuricon/memoria:latest, published by the
# `Deploy` GitHub Actions workflow.

services:
  app:
    image: ghcr.io/futuricon/memoria:latest
    container_name: memoria-app
    pull_policy: always
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:8080
      ConnectionStrings__Postgres: "Host=127.0.0.1;Port=5432;Database=${POSTGRES_DB:-memoria};Username=${POSTGRES_USER:-memoria};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER:-memoria}
      Jwt__Audience: ${JWT_AUDIENCE:-memoria-api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-memoria_bot}
      OAuth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      OAuth__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      OAuth__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Cors__AllowedOrigins__0: ${SPA_ORIGIN:-https://memoria.example.com}
      Hangfire__AllowedEmails__0: ${HANGFIRE_ADMIN_EMAIL:-}
      # AI grading. Provider = Claude | DeepSeek. Empty key → grading/validation
      # degrade fail-open (app still boots). Leave BASE_URL/models empty to use
      # the provider defaults. Set AI_* in /opt/memoria/.env.
      Ai__Provider: ${AI_PROVIDER:-Claude}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__GradingModel: ${AI_GRADING_MODEL:-}
      Ai__ValidationModel: ${AI_VALIDATION_MODEL:-}
    volumes:
      - memoria-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Promtail ships Memoria/nginx/Postgres logs to Grafana Cloud Loki.
  # If LOKI_URL/USER/PASSWORD are empty in /opt/memoria/.env the container
  # will restart-loop (Promtail requires a valid clients[].url). Add the
  # creds from grafana.com/orgs/<your-org>/stacks → Loki "Send Logs" wizard,
  # then redeploy / `docker compose -f docker-compose.prod.yml up -d`.
  promtail:
    image: grafana/promtail:3.2.1
    container_name: memoria-promtail
    restart: unless-stopped
    network_mode: host
    command:
      - -config.file=/etc/promtail/promtail.yml
      - -config.expand-env=true
    environment:
      LOKI_URL: ${LOKI_URL:-}
      LOKI_USER: ${LOKI_USER:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      HOSTNAME: ${LOG_HOSTNAME:-memoria-vps}
    volumes:
      - ./deploy/promtail-config.yml:/etc/promtail/promtail.yml:ro
      - memoria-logs:/var/log/memoria:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log/postgresql:/var/log/postgresql:ro
      - promtail-data:/var/lib/promtail

volumes:
  memoria-logs:
  promtail-data:
