# Production compose: Memoria runs on the host network stack (single container,
# no extra layer of bridge networking), connects to PostgreSQL on 127.0.0.1:5432
# of the host machine, and listens on 127.0.0.1:8080 (nginx reverse-proxies HTTPS
# from memoria.example.com → http://127.0.0.1:8080).
#
# Secrets are read from /opt/memoria/.env on the VPS (NEVER committed to git).
# Image is pulled from ghcr.io/futuricon/memoria:latest, published by the
# `Deploy` GitHub Actions workflow.

services:
  app:
    image: ghcr.io/futuricon/memoria:latest
    container_name: memoria-app
    pull_policy: always
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:8080
      ConnectionStrings__Postgres: "Host=127.0.0.1;Port=5432;Database=${POSTGRES_DB:-memoria};Username=${POSTGRES_USER:-memoria};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER:-memoria}
      Jwt__Audience: ${JWT_AUDIENCE:-memoria-api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-memoria_bot}
      Telegram__SpaUrl: ${SPA_ORIGIN:-https://memoria.futuricon.net}
      OAuth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      OAuth__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      OAuth__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Cors__AllowedOrigins__0: ${SPA_ORIGIN:-https://memoria.example.com}
      Hangfire__AllowedEmails__0: ${HANGFIRE_ADMIN_EMAIL:-}
      # AI grading. Provider = Claude | DeepSeek. Empty key → grading/validation
      # degrade fail-open (app still boots). Leave BASE_URL/models empty to use
      # the provider defaults. Set AI_* in /opt/memoria/.env.
      Ai__Provider: ${AI_PROVIDER:-Claude}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__GradingModel: ${AI_GRADING_MODEL:-}
      Ai__ValidationModel: ${AI_VALIDATION_MODEL:-}
      # Resend transactional email (SPA verification codes). Empty key falls
      # back to the LoggingEmailSender stub — codes will only appear in the
      # app log, no email is sent. Configure RESEND_API_KEY in /opt/memoria/.env
      # and verify the sender domain in the Resend dashboard.
      Email__ApiKey: ${RESEND_API_KEY:-}
      Email__FromAddress: ${RESEND_FROM_ADDRESS:-Memoria <noreply@memoria.futuricon.net>}
      # Логирование. Дефолт = поведение из appsettings.json. Чтобы крутануть до
      # Debug на время разбора — выставить LOG_LEVEL=Debug в /opt/memoria/.env
      # и пересоздать контейнер. Не держи Microsoft.* в Debug долго — это даёт
      # SQL-каждой-команды от EF и тысячи строк в час.
      Serilog__MinimumLevel__Default: ${LOG_LEVEL:-Information}
      Serilog__MinimumLevel__Override__Microsoft: ${LOG_LEVEL_MICROSOFT:-Warning}
      Serilog__MinimumLevel__Override__System: ${LOG_LEVEL_SYSTEM:-Warning}
      Serilog__MinimumLevel__Override__Microsoft.AspNetCore: ${LOG_LEVEL_ASPNETCORE:-Warning}
    volumes:
      - memoria-logs:/app/logs
    restart: unless-stopped
    # Cap the json-file logs Dozzle reads from so they can't grow unbounded.
    # Sized for Debug-level bursts during analysis (~500 MB total).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Dozzle — live Docker-container log viewer. Reads container stdout via the
  # (read-only) docker socket, so it sees memoria-app + itself, NOT the host
  # nginx/postgres (those live outside Docker — use journalctl / /var/log on the
  # host). Bound to loopback only; exposed read-only via nginx + basic-auth at
  # logs.<domain> (see deploy/nginx-dozzle.conf).
  dozzle:
    image: amir20/dozzle:latest   # pin a version (amir20/dozzle:vX.Y.Z) for reproducible prod
    container_name: memoria-dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  memoria-logs:
